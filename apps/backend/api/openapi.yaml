openapi: 3.0.3
info:
  title: Digolitus Status Page API
  version: 1.0.0
  description: |
    API do Digolitus Status Page. Toda funcionalidade de negócio está disponível por esta API;
    a interface web é apenas um cliente dela.

    ## Status declarado, não monitorado
    Os status publicados são **declarados por operadores** (status dos componentes, incidentes e
    manutenções). Esta versão não executa verificações automáticas de disponibilidade. O campo
    `overall.basis` em `/api/v1/status` vale sempre `declared`.

    ## Política de status
    - O status efetivo de um componente é o mais grave entre o status declarado, o impacto dos
      incidentes ativos que o afetam (o impacto usa o mesmo vocabulário do status; impacto `operational`
      é informativo e não degrada componentes) e `maintenance` quando há manutenção em andamento.
    - Ordem de gravidade: `major_outage` > `partial_outage` > `degraded_performance` > `maintenance` > `operational`.
    - O status geral é o mais grave entre os componentes públicos ativos e os incidentes ativos que não
      afetam componentes públicos. Manutenção nunca é tratada como indisponibilidade: se o mais grave for
      `maintenance`, o status geral é `maintenance`. Sem componentes públicos nem incidentes ativos, o
      status geral é `unknown`.
    - Status de terceiros (`third_party`) é informado pelos próprios provedores, aparece separado e **nunca**
      altera o status geral.
    - Grupos de componentes não têm status próprio: o status de um grupo é o mais grave entre seus componentes
      públicos e serve apenas para apresentação.

    ## Administração sem autenticação
    As rotas sob `/api/v1/admin/` **não possuem autenticação nesta versão** e permitem alterar todos os
    dados. Mantenha-as acessíveis apenas em rede confiável (por padrão o Docker Compose publica a
    aplicação somente em `127.0.0.1`). Swagger UI, CORS ou rotas não divulgadas **não** substituem
    autenticação. Cada alteração é auditada com a origem `admin_api` e o `X-Request-ID`; não há identidade
    de usuário verificável.

    ## Convenções
    - JSON em `snake_case`. Requisições com campos desconhecidos são rejeitadas (422).
    - Instantes em RFC 3339, sempre retornados em UTC (`Z`).
    - Listas paginadas por `limit` (1–100, padrão 20) e `offset` (0–100000), com ordenação determinística.
      `sort=campo` ordena de forma crescente; `sort=-campo`, decrescente.
    - Erros seguem o envelope `Error`, com `code` estável para uso programático.
    - Corpo limitado a 64 KiB. Toda resposta inclui `X-Request-ID`.
servers:
  - url: /
    description: Mesmo host (via proxy do frontend em http://localhost:8080)
tags:
  - name: health
    description: Saúde do processo e prontidão para atender requisições.
  - name: public
    description: Consulta pública, sem autenticação e somente leitura.
  - name: admin-components
    description: Gestão de componentes e grupos de componentes. **Sem autenticação nesta versão.**
  - name: admin-third-party
    description: Status de terceiros (Atlassian Statuspage). **Sem autenticação nesta versão.**
  - name: admin-incidents
    description: Ciclo de vida de incidentes. **Sem autenticação nesta versão.**
  - name: admin-maintenances
    description: Manutenções programadas. **Sem autenticação nesta versão.**
  - name: admin-templates
    description: Templates de incidentes e manutenções. **Sem autenticação nesta versão.**
  - name: admin-announcements
    description: Comunicados gerais, categorias e times responsáveis. **Sem autenticação nesta versão.**
  - name: admin-audit
    description: Histórico operacional (auditoria). **Sem autenticação nesta versão.**

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      description: Indica que o processo está vivo e atende HTTP. Não verifica o banco de dados.
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: Indica que o processo está pronto para atender, incluindo conexão com o PostgreSQL (timeout de 2 s).
      responses:
        '200':
          description: Pronto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ready }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/openapi.yaml:
    get:
      tags: [health]
      operationId: getOpenAPISpec
      summary: Especificação OpenAPI
      description: Este documento. A Swagger UI está em `/swagger/`.
      responses:
        '200':
          description: Documento OpenAPI 3.0 em YAML.
          content:
            application/yaml:
              schema: { type: object }

  /api/v1/status:
    get:
      tags: [public]
      operationId: getStatusSummary
      summary: Resumo público de status
      description: |
        Status geral, componentes públicos com status efetivo, incidentes ativos com linha do tempo e
        manutenções em andamento e futuras. Os dados são lidos em um snapshot consistente.
      responses:
        '200':
          description: Resumo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusSummary' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/components:
    get:
      tags: [public]
      operationId: listPublicComponents
      summary: Componentes públicos
      description: Componentes públicos e ativos com status efetivo, na ordem de exibição.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicComponentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/incidents:
    get:
      tags: [public]
      operationId: listPublicIncidents
      summary: Incidentes (ativos e históricos)
      parameters:
        - $ref: '#/components/parameters/IncidentState'
        - $ref: '#/components/parameters/IncidentImpactFilter'
        - $ref: '#/components/parameters/IncidentSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada com a atualização mais recente de cada incidente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicIncidentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/incidents/{id}:
    get:
      tags: [public]
      operationId: getPublicIncident
      summary: Incidente com linha do tempo
      description: Inclui até 100 atualizações, da mais recente para a mais antiga.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Incidente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicIncident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/maintenances:
    get:
      tags: [public]
      operationId: listPublicMaintenances
      summary: Manutenções programadas
      parameters:
        - $ref: '#/components/parameters/MaintenanceState'
        - $ref: '#/components/parameters/MaintenanceSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMaintenanceList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/maintenances/{id}:
    get:
      tags: [public]
      operationId: getPublicMaintenance
      summary: Manutenção com histórico de atualizações
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Manutenção.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMaintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/announcements:
    get:
      tags: [public]
      operationId: listPublicAnnouncements
      summary: Comunicados publicados
      description: Somente comunicados publicados cujo horário de publicação já chegou, do mais recente para o mais antigo.
      parameters:
        - $ref: '#/components/parameters/AnnouncementCategoryFilter'
        - $ref: '#/components/parameters/AnnouncementComponentFilter'
        - $ref: '#/components/parameters/AnnouncementPinnedFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAnnouncementList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/announcements/{id}:
    get:
      tags: [public]
      operationId: getPublicAnnouncement
      summary: Comunicado publicado
      description: Rascunhos, agendados e arquivados resultam em 404.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Comunicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAnnouncement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/announcement-categories:
    get:
      tags: [public]
      operationId: listPublicAnnouncementCategories
      summary: Categorias ativas de comunicados
      responses:
        '200':
          description: Até 100 categorias, na ordem de exibição.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAnnouncementCategoryList' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/components:
    get:
      tags: [admin-components]
      operationId: listComponents
      summary: Listar componentes
      parameters:
        - { name: is_active, in: query, schema: { type: boolean }, description: Filtra por ativo/desativado. }
        - { name: is_public, in: query, schema: { type: boolean }, description: Filtra por visibilidade pública. }
        - { name: group_id, in: query, schema: { type: string, format: uuid }, description: Componentes do grupo informado. }
        - name: sort
          in: query
          description: 'Ordenação. Padrão: `display_order`.'
          schema: { type: string, enum: [display_order, -display_order, name, -name, created_at, -created_at, updated_at, -updated_at] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-components]
      operationId: createComponent
      summary: Criar componente
      description: Quando `slug` é omitido, é derivado do nome (sem acentos).
      requestBody:
        $ref: '#/components/requestBodies/ComponentCreate'
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/components/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-components]
      operationId: getComponent
      summary: Consultar componente
      responses:
        '200':
          description: Componente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-components]
      operationId: updateComponent
      summary: Atualizar, desativar ou reativar componente
      description: |
        Atualização parcial. Componentes não são excluídos: `is_active: false` os remove da página pública
        e de novas associações, preservando o histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentPatch' }
            example: { status: degraded_performance }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/component-groups:
    get:
      tags: [admin-components]
      operationId: listComponentGroups
      summary: Listar grupos de componentes
      parameters:
        - name: sort
          in: query
          description: 'Padrão: `display_order`.'
          schema: { type: string, enum: [display_order, -display_order, name, -name, created_at, -created_at] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentGroupList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-components]
      operationId: createComponentGroup
      summary: Criar grupo de componentes
      description: Associe componentes ao grupo pelo campo `group_id` do componente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentGroupCreate' }
            example: { name: Pagamentos, description: Serviços de cobrança e checkout. }
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentGroup' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/component-groups/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-components]
      operationId: getComponentGroup
      summary: Consultar grupo
      responses:
        '200':
          description: Grupo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentGroup' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-components]
      operationId: updateComponentGroup
      summary: Atualizar grupo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentGroupPatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentGroup' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [admin-components]
      operationId: deleteComponentGroup
      summary: Excluir grupo vazio
      description: |
        Só é possível excluir um grupo sem componentes (inclusive desativados). Mova-os antes
        (`PATCH /api/v1/admin/components/{id}` com `group_id`); caso contrário retorna 409 `component_group_not_empty`.
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }


  /api/v1/admin/external-sources:
    get:
      tags: [admin-third-party]
      operationId: listExternalSources
      summary: Listar provedores de status de terceiros
      responses:
        '200':
          description: Provedores na ordem de exibição (no máximo 50).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSourceList' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-third-party]
      operationId: createExternalSource
      summary: Cadastrar provedor (Atlassian Statuspage)
      description: |
        Informe a URL pública da página de status (ex.: `https://www.githubstatus.com`). O backend normaliza para
        `https://host`, lê `/api/v2/summary.json` uma vez para validar e importar os componentes (nenhum
        selecionado) e cadastra o provedor. Só HTTPS e endereços públicos são aceitos; redirecionamentos para
        HTTP e conexões a IPs privados ou de loopback são recusados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalSourceCreate' }
            example: { url: 'https://www.githubstatus.com' }
      responses:
        '201':
          description: Cadastrado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSource' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/external-sources/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-third-party]
      operationId: getExternalSource
      summary: Consultar provedor
      responses:
        '200':
          description: Provedor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSource' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-third-party]
      operationId: updateExternalSource
      summary: Renomear, ativar/desativar ou reordenar provedor
      description: A URL não muda; para trocar de página, cadastre outro provedor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalSourcePatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSource' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [admin-third-party]
      operationId: deleteExternalSource
      summary: Remover provedor
      description: Remove o provedor e os componentes importados (configuração, não histórico).
      responses:
        '204': { description: Removido. }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/external-sources/{id}/sync:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-third-party]
      operationId: syncExternalSource
      summary: Sincronizar agora
      description: Lê o provedor imediatamente. Em caso de falha, o erro fica registrado em `last_error` e a resposta é 502.
      responses:
        '200':
          description: Sincronizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalSource' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/v1/admin/external-sources/{id}/components:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-third-party]
      operationId: listExternalComponents
      summary: Componentes importados do provedor
      responses:
        '200':
          description: Componentes, agrupados como no provedor (presentes primeiro).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalComponentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/external-sources/{id}/selection:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    put:
      tags: [admin-third-party]
      operationId: setExternalSelection
      summary: Definir componentes publicados
      description: Substitui a seleção. Uma lista vazia deixa o provedor fora da página pública.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalSelection' }
      responses:
        '200':
          description: Seleção aplicada; retorna todos os componentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalComponentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/incidents:
    get:
      tags: [admin-incidents]
      operationId: listIncidents
      summary: Listar incidentes
      parameters:
        - $ref: '#/components/parameters/IncidentState'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IncidentStatus' } }
        - $ref: '#/components/parameters/IncidentImpactFilter'
        - { name: component_id, in: query, schema: { type: string, format: uuid }, description: Incidentes associados ao componente. }
        - $ref: '#/components/parameters/IncidentSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-incidents]
      operationId: createIncident
      summary: Abrir incidente
      description: |
        Cria o incidente e publica a primeira atualização na mesma transação. O status inicial deve ser
        aberto (`investigating`, `identified` ou `monitoring`). Componentes desativados não podem ser associados.
        `template_id` apenas registra o template usado para preencher o formulário; o texto é copiado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentCreate' }
            example:
              title: Lentidão na API pública
              message: Estamos investigando relatos de lentidão.
              impact: degraded_performance
              component_ids: [3f1c2b4a-8d2e-4c1a-9b7e-1a2b3c4d5e6f]
      responses:
        '201':
          description: Criado, com a linha do tempo.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incidents/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-incidents]
      operationId: getIncident
      summary: Consultar incidente
      responses:
        '200':
          description: Incidente com linha do tempo (até 100 atualizações).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-incidents]
      operationId: updateIncident
      summary: Editar metadados do incidente
      description: |
        Edita título, impacto, notas internas e início, sem publicar atualização. Status, mensagens e
        componentes afetados mudam apenas por atualizações publicadas (`POST .../updates`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentPatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incidents/{id}/updates:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-incidents]
      operationId: listIncidentUpdates
      summary: Linha do tempo paginada
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Atualizações, da mais recente para a mais antiga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentUpdateList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-incidents]
      operationId: publishIncidentUpdate
      summary: Publicar atualização (e transição de status)
      description: |
        Publica uma entrada imutável na linha do tempo. Transições válidas: de qualquer status aberto
        (`investigating`, `identified`, `monitoring`) para qualquer status, inclusive o mesmo (atualização
        só de mensagem) e `resolved`. Incidentes resolvidos não aceitam atualizações (409 `incident_resolved`).
        `component_ids`, quando enviado, substitui os componentes afetados e fica registrado na atualização.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentUpdateCreate' }
            example: { status: identified, message: Identificamos a causa e estamos aplicando a correção. }
      responses:
        '201':
          description: Publicada. Retorna o incidente atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incidents/{id}/resolve:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-incidents]
      operationId: resolveIncident
      summary: Encerrar incidente
      description: |
        Publica a mensagem de encerramento, define `resolved_at` e retira o incidente da lista de ativos,
        mantendo-o no histórico. Encerrar um incidente já resolvido retorna 409 `incident_already_resolved`
        (não é ignorado silenciosamente, para que nenhuma mensagem seja descartada sem aviso).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentResolve' }
            example: { message: O problema foi resolvido. }
      responses:
        '200':
          description: Resolvido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/maintenances:
    get:
      tags: [admin-maintenances]
      operationId: listMaintenances
      summary: Listar manutenções
      parameters:
        - $ref: '#/components/parameters/MaintenanceState'
        - { name: component_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/MaintenanceSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-maintenances]
      operationId: createMaintenance
      summary: Programar manutenção
      description: |
        `scheduled_start` e `scheduled_end` aceitam RFC 3339 com offset ou data e hora locais
        (`AAAA-MM-DDTHH:MM[:SS]`) interpretadas no `timezone` IANA informado. O servidor armazena os
        instantes em UTC; o timezone da máquina ou do navegador nunca é usado. O término deve ser posterior
        ao início, estar no futuro, e a janela deve ter no máximo 31 dias.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceCreate' }
            example:
              title: Atualização do banco de dados
              message: Faremos uma atualização programada.
              expected_impact: degraded_performance
              timezone: America/Sao_Paulo
              scheduled_start: '2026-11-20T02:00'
              scheduled_end: '2026-11-20T04:00'
      responses:
        '201':
          description: Programada.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-maintenances]
      operationId: getMaintenance
      summary: Consultar manutenção
      responses:
        '200':
          description: Manutenção com histórico (até 100 atualizações).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-maintenances]
      operationId: updateMaintenance
      summary: Editar ou reprogramar manutenção
      description: |
        Permitido apenas para `scheduled` e `in_progress` (409 `maintenance_closed` caso contrário). O início
        previsto não pode mudar depois que a manutenção começou (409 `maintenance_already_started`). Alterar
        apenas `timezone` não muda os instantes, somente a apresentação. Reprogramações ficam no histórico
        operacional; para explicá-las publicamente, publique uma mensagem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenancePatch' }
      responses:
        '200':
          description: Atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}/updates:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-maintenances]
      operationId: listMaintenanceUpdates
      summary: Histórico paginado
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Atualizações, da mais recente para a mais antiga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceUpdateList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-maintenances]
      operationId: publishMaintenanceMessage
      summary: Publicar mensagem
      description: Publica uma mensagem sem mudar o status. Apenas para manutenções `scheduled` ou `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceMessageCreate' }
      responses:
        '201':
          description: Publicada. Retorna a manutenção atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}/start:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-maintenances]
      operationId: startMaintenance
      summary: Iniciar manutenção
      description: '`scheduled` → `in_progress`. `started_at` recebe o horário do servidor; início antecipado é permitido.'
      requestBody: { $ref: '#/components/requestBodies/MaintenanceTransition' }
      responses: &transitionResponses
        '200':
          description: Transição aplicada. Retorna a manutenção atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}/complete:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-maintenances]
      operationId: completeMaintenance
      summary: Concluir manutenção
      description: '`in_progress` → `completed`. Nunca ocorre automaticamente ao fim da janela prevista.'
      requestBody: { $ref: '#/components/requestBodies/MaintenanceTransition' }
      responses: *transitionResponses
  /api/v1/admin/maintenances/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-maintenances]
      operationId: cancelMaintenance
      summary: Cancelar manutenção
      description: '`scheduled` → `cancelled`. Uma manutenção em andamento deve ser concluída, não cancelada.'
      requestBody: { $ref: '#/components/requestBodies/MaintenanceTransition' }
      responses: *transitionResponses

