  /api/v1/admin/announcements:
    get:
      tags: [admin-announcements]
      operationId: listAnnouncements
      summary: Listar comunicados
      parameters:
        - name: state
          in: query
          description: '`draft`, `scheduled` (publicado com horário futuro), `published` ou `archived`.'
          schema: { $ref: '#/components/schemas/AnnouncementState' }
        - name: q
          in: query
          description: Busca no título (sem diferenciar maiúsculas).
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/AnnouncementCategoryFilter'
        - name: team_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/AnnouncementComponentFilter'
        - $ref: '#/components/parameters/AnnouncementPinnedFilter'
        - name: sort
          in: query
          description: 'Padrão: `-updated_at`.'
          schema: { type: string, enum: [updated_at, -updated_at, created_at, -created_at, published_at, -published_at, title, -title] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-announcements]
      operationId: createAnnouncement
      summary: Criar comunicado (rascunho)
      description: O comunicado nasce como rascunho. Publique com `POST .../{id}/publish`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementCreate' }
            example: { title: Nova região disponível, body: "A partir de hoje a API também atende a região sa-east-1.", importance: info }
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/announcements/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-announcements]
      operationId: getAnnouncement
      summary: Consultar comunicado
      responses:
        '200':
          description: Comunicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-announcements]
      operationId: updateAnnouncement
      summary: Editar comunicado
      description: Permitido em qualquer estado. Em comunicados publicados, `updated_at` aparece como "atualizado em".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementPatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [admin-announcements]
      operationId: deleteAnnouncement
      summary: Excluir rascunho
      description: Somente rascunhos (409 `announcement_not_draft` nos demais estados).
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/announcements/{id}/publish:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-announcements]
      operationId: publishAnnouncement
      summary: Publicar ou agendar
      description: '`draft` → publicado. Sem `publish_at`, publica agora; com horário futuro (até 1 ano), fica agendado (`scheduled`).'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementPublish' }
            example: { publish_at: '2026-11-20T09:00:00-03:00' }
      responses: &announcementTransition
        '200':
          description: Transição aplicada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/announcements/{id}/unpublish:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-announcements]
      operationId: unpublishAnnouncement
      summary: Despublicar
      description: '`published` ou `scheduled` → `draft`. Remove o comunicado da página pública.'
      responses: *announcementTransition
  /api/v1/admin/announcements/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-announcements]
      operationId: archiveAnnouncement
      summary: Arquivar
      description: '`published` → `archived`. Sai da página pública e mantém o registro.'
      responses: *announcementTransition
  /api/v1/admin/announcements/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-announcements]
      operationId: restoreAnnouncement
      summary: Restaurar
      description: '`archived` → `published`, com a data de publicação original.'
      responses: *announcementTransition
  /api/v1/admin/announcement-categories:
    get:
      tags: [admin-announcements]
      operationId: listAnnouncementCategorys
      summary: Listar categorias de comunicados
      parameters:
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Até 100 itens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementCategoryList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-announcements]
      operationId: createAnnouncementCategory
      summary: Criar (categorias de comunicados)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementCategoryCreate' }
            example: { name: Novidades, color: blue }
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementCategory' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/announcement-categories/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-announcements]
      operationId: getAnnouncementCategory
      summary: Consultar (categorias de comunicados)
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-announcements]
      operationId: updateAnnouncementCategory
      summary: Atualizar (categorias de comunicados)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementCategoryPatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [admin-announcements]
      operationId: deleteAnnouncementCategory
      summary: Excluir (categorias de comunicados)
      description: Somente categorias sem comunicados (409 `announcement_category_in_use`); as demais podem ser desativadas.
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/teams:
    get:
      tags: [admin-announcements]
      operationId: listTeams
      summary: Listar times responsáveis
      parameters:
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Até 100 itens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-announcements]
      operationId: createTeam
      summary: Criar (times responsáveis)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreate' }
            example: { name: Time de Plataforma }
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/teams/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-announcements]
      operationId: getTeam
      summary: Consultar (times responsáveis)
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-announcements]
      operationId: updateTeam
      summary: Atualizar (times responsáveis)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamPatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [admin-announcements]
      operationId: deleteTeam
      summary: Excluir (times responsáveis)
      description: Somente times sem comunicados (409 `team_in_use`); os demais podem ser desativados.
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/audit-events:
    get:
      tags: [admin-audit]
      operationId: listAuditEvents
      summary: Histórico operacional
      description: |
        Eventos registrados na mesma transação de cada alteração. `source` identifica o canal (`admin_api`);
        não há identidade de usuário nesta versão.
      parameters:
        - name: resource_type
          in: query
          schema: { type: string, enum: [component, component_group, incident, maintenance, incident_template, maintenance_template, external_source, announcement, announcement_category, team] }
        - { name: resource_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 64 }, description: 'Ex.: created, updated, resolved, started.' }
        - name: sort
          in: query
          description: 'Padrão: `-occurred_at`.'
          schema: { type: string, enum: [occurred_at, -occurred_at] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identificador do recurso. Valores que não são UUID resultam em 404.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    IncidentState:
      name: state
      in: query
      description: '`active` (não resolvidos) ou `resolved`.'
      schema: { type: string, enum: [active, resolved] }
    IncidentImpactFilter:
      name: impact
      in: query
      schema: { $ref: '#/components/schemas/IncidentImpact' }
    IncidentSort:
      name: sort
      in: query
      description: 'Padrão: `-started_at`.'
      schema: { type: string, enum: [started_at, -started_at, created_at, -created_at, updated_at, -updated_at] }
    MaintenanceState:
      name: state
      in: query
      description: |
        `upcoming` (scheduled), `in_progress`, `completed`, `cancelled`, `open` (scheduled + in_progress) ou
        `past` (completed + cancelled). Padrão de ordenação: `scheduled_start` para upcoming/in_progress/open e
        `-scheduled_start` para os demais.
      schema: { type: string, enum: [upcoming, in_progress, completed, cancelled, open, past] }
    MaintenanceSort:
      name: sort
      in: query
      schema: { type: string, enum: [scheduled_start, -scheduled_start, created_at, -created_at, updated_at, -updated_at] }
    AnnouncementCategoryFilter:
      name: category_id
      in: query
      schema: { type: string, format: uuid }
    AnnouncementComponentFilter:
      name: component_id
      in: query
      description: Comunicados associados ao componente.
      schema: { type: string, format: uuid }
    AnnouncementPinnedFilter:
      name: pinned
      in: query
      description: '`true` para somente fixados; `false` para somente não fixados.'
      schema: { type: boolean }
    TemplateSort:
      name: sort
      in: query
      description: 'Padrão: `name`.'
      schema: { type: string, enum: [name, -name, created_at, -created_at, updated_at, -updated_at] }

  headers:
    Location:
      description: URL do recurso criado.
      schema: { type: string }

  requestBodies:
    ComponentCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ComponentCreate' }
          example: { name: API pública, description: Endpoints REST para integrações. }
    MaintenanceTransition:
      required: false
      description: Corpo opcional com mensagem pública da transição.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MaintenanceTransition' }
          example: { message: A manutenção foi iniciada. }

  responses:
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: incident_not_found, message: Recurso não encontrado., request_id: 4f2a9c1b7d3e5a6b8c9d0e1f } }
    Conflict:
      description: |
        Conflito com o estado atual. Códigos: `component_slug_conflict`, `component_group_name_conflict`,
        `component_group_not_empty`, `external_source_conflict`, `external_source_limit`, `template_name_conflict`,
        `incident_resolved`, `incident_already_resolved`, `maintenance_closed`, `maintenance_already_started`,
        `maintenance_invalid_transition`, `invalid_announcement_transition`, `announcement_not_draft`,
        `announcement_category_name_conflict`, `announcement_category_in_use`, `announcement_category_limit`,
        `team_name_conflict`, `team_in_use`, `team_limit`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: maintenance_invalid_transition, message: "A ação 'complete' não é permitida para uma manutenção com status 'scheduled'.", request_id: 4f2a9c1b7d3e5a6b8c9d0e1f } }
    ValidationError:
      description: Dados inválidos (`validation_failed`, `invalid_json`, `empty_update`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: validation_failed, message: Os dados enviados são inválidos., details: [ { field: title, message: Informe um título com 1 a 200 caracteres. } ], request_id: 4f2a9c1b7d3e5a6b8c9d0e1f } }
    PayloadTooLarge:
      description: Corpo maior que 64 KiB (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Corpo enviado com Content-Type diferente de application/json (`unsupported_media_type`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependência indisponível ou tempo limite excedido (`database_unavailable`, `request_timeout`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Falha ao consultar o provedor externo (`external_fetch_failed`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Erro inesperado (`internal_error`). Detalhes ficam apenas nos logs, correlacionados por `request_id`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, description: Código estável para tratamento programático. }
            message: { type: string, description: Mensagem legível (pt-BR). }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
            request_id: { type: string }

    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }

    ComponentStatus:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage, maintenance]
      description: Status declarado (ou efetivo, nas rotas públicas) de um componente.
    OverallStatus:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage, maintenance, unknown]
    IncidentStatus:
      type: string
      enum: [investigating, identified, monitoring, resolved]
      description: '`resolved` é terminal.'
    OpenIncidentStatus:
      type: string
      enum: [investigating, identified, monitoring]
    IncidentImpact:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage]
      description: 'Impacto nos componentes afetados, com o mesmo vocabulário do status. `operational` é informativo.'
    MaintenanceStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]
      description: 'Transições: scheduled → in_progress → completed; scheduled → cancelled.'
    ExpectedImpact:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage]
      description: 'Impacto esperado, com o mesmo vocabulário do impacto de incidentes.'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 em UTC.
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
    InputInstant:
      type: string
      description: RFC 3339 com offset (ex. `2026-11-20T02:00:00-03:00`) ou data e hora locais (`2026-11-20T02:00`) interpretadas no `timezone`.
      example: '2026-11-20T02:00'
    UUIDList:
      type: array
      maxItems: 50
      items: { type: string, format: uuid }

    ComponentRef:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    Component:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, status, is_public, is_active, display_order, group_id, url, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        is_public: { type: boolean }
        is_active: { type: boolean }
        display_order: { type: integer }
        group_id: { type: string, format: uuid, nullable: true, description: Grupo do componente; `null` quando não agrupado. }
        url: { type: string, nullable: true, description: 'Link público da página do componente (documentação, produto, endpoint).' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ComponentCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: Único. Derivado do nome quando omitido. }
        description: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        is_public: { type: boolean, default: true }
        display_order: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        group_id: { type: string, format: uuid, nullable: true }
        url: &componentUrl { type: string, nullable: true, maxLength: 500, description: 'Endereço http(s) completo, sem credenciais. Vazio ou `null` = sem link.' }
    ComponentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        is_public: { type: boolean }
        is_active: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
        group_id: { type: string, format: uuid, nullable: true, description: '`null` remove o componente do grupo.' }
        url: *componentUrl
    ComponentList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Component' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PublicComponent:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, status, group_id, url, display_order, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        group_id: { type: string, format: uuid, nullable: true }
        url: { type: string, nullable: true, description: Link da página do componente. }
        display_order: { type: integer }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PublicComponentGroup:
      type: object
      additionalProperties: false
      required: [id, name, description, display_order, status, component_count, affected_components, components_under_maintenance]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        display_order: { type: integer }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        component_count: { type: integer, description: Componentes públicos do grupo. }
        affected_components: { type: integer }
        components_under_maintenance: { type: integer }
    ExternalComponentStatus:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage, maintenance, unknown]
      description: Status informado pelo provedor (`under_maintenance` vira `maintenance`); `unknown` quando não reconhecido ou desatualizado.
    ExternalSource:
      type: object
      additionalProperties: false
      required: [id, name, provider, base_url, page_name, is_active, display_order, indicator, indicator_description, last_checked_at, last_success_at, last_error, stale, component_count, selected_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        provider: { type: string, enum: [statuspage] }
        base_url: { type: string, description: 'Normalizada para https://host.' }
        page_name: { type: string, description: Nome da página informado pelo provedor. }
        is_active: { type: boolean, description: Inativos não são sincronizados nem publicados. }
        display_order: { type: integer }
        indicator: { type: string, nullable: true, enum: [none, minor, major, critical, maintenance], description: Indicador geral do provedor. }
        indicator_description: { type: string }
        last_checked_at: { $ref: '#/components/schemas/NullableTimestamp' }
        last_success_at: { $ref: '#/components/schemas/NullableTimestamp' }
        last_error: { type: string, nullable: true, description: 'Erro da última tentativa, se falhou.' }
        stale: { type: boolean, description: 'Última leitura bem-sucedida mais antiga que max(3 × intervalo, 10 min).' }
        component_count: { type: integer }
        selected_count: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ExternalSourceCreate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 500, description: 'URL pública da página (https). Ex.: https://www.githubstatus.com' }
        name: { type: string, minLength: 1, maxLength: 120, description: 'Padrão: nome informado pelo provedor.' }
        display_order: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    ExternalSourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        is_active: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
    ExternalSourceList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ExternalSource' } }
    ExternalComponent:
      type: object
      additionalProperties: false
      required: [id, external_id, name, description, group_name, status, is_selected, is_present]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string, description: Identificador no provedor. }
        name: { type: string }
        description: { type: string }
        group_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ExternalComponentStatus' }
        is_selected: { type: boolean }
        is_present: { type: boolean, description: Falso quando o provedor deixou de listar o componente. }
    ExternalComponentList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ExternalComponent' } }
    ExternalSelection:
      type: object
      additionalProperties: false
      required: [component_ids]
      properties:
        component_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
    PublicThirdPartySource:
      type: object
      additionalProperties: false
      required: [id, name, page_url, status, stale, last_success_at, components, events]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        page_url: { type: string, description: Página de status original do provedor. }
        status: { $ref: '#/components/schemas/OverallStatus' }
        stale: { type: boolean, description: Dados desatualizados; status reportados como `unknown`. }
        last_success_at: { $ref: '#/components/schemas/NullableTimestamp' }
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, group_name, status]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              group_name: { type: string, nullable: true }
              status: { $ref: '#/components/schemas/ExternalComponentStatus' }
        events:
          type: array
          description: Incidentes não resolvidos e manutenções em andamento do provedor que afetam os componentes selecionados.
          items:
            type: object
            additionalProperties: false
            required: [kind, name, status, impact, url]
            properties:
              kind: { type: string, enum: [incident, maintenance] }
              name: { type: string }
              status: { type: string }
              impact: { type: string }
              url: { type: string, nullable: true }
    ComponentGroup:
      type: object
      additionalProperties: false
      required: [id, name, description, display_order, component_count, created_at, updated_at]
      properties:
