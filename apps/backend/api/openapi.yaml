openapi: 3.0.3
info:
  title: Digolitus Status Page API
  version: 1.0.0
  description: |
    API do Digolitus Status Page. Toda funcionalidade de negócio está disponível por esta API;
    a interface web é apenas um cliente dela.

    ## Status declarado, não monitorado
    Os status publicados são **declarados por operadores** (status dos componentes, incidentes e
    manutenções). Esta versão não executa verificações automáticas de disponibilidade. O campo
    `overall.basis` em `/api/v1/status` vale sempre `declared`.

    ## Política de status
    - O status efetivo de um componente é o mais grave entre o status declarado, o impacto dos
      incidentes ativos que o afetam (`minor` → `degraded_performance`, `major` → `partial_outage`,
      `critical` → `major_outage`) e `maintenance` quando há manutenção em andamento.
    - Ordem de gravidade: `major_outage` > `partial_outage` > `degraded_performance` > `maintenance` > `operational`.
    - O status geral é o mais grave entre os componentes públicos ativos e os incidentes ativos que não
      afetam componentes públicos. Manutenção nunca é tratada como indisponibilidade: se o mais grave for
      `maintenance`, o status geral é `maintenance`. Sem componentes públicos nem incidentes ativos, o
      status geral é `unknown`.

    ## Administração sem autenticação
    As rotas sob `/api/v1/admin/` **não possuem autenticação nesta versão** e permitem alterar todos os
    dados. Mantenha-as acessíveis apenas em rede confiável (por padrão o Docker Compose publica a
    aplicação somente em `127.0.0.1`). Swagger UI, CORS ou rotas não divulgadas **não** substituem
    autenticação. Cada alteração é auditada com a origem `admin_api` e o `X-Request-ID`; não há identidade
    de usuário verificável.

    ## Convenções
    - JSON em `snake_case`. Requisições com campos desconhecidos são rejeitadas (422).
    - Instantes em RFC 3339, sempre retornados em UTC (`Z`).
    - Listas paginadas por `limit` (1–100, padrão 20) e `offset` (0–100000), com ordenação determinística.
      `sort=campo` ordena de forma crescente; `sort=-campo`, decrescente.
    - Erros seguem o envelope `Error`, com `code` estável para uso programático.
    - Corpo limitado a 64 KiB. Toda resposta inclui `X-Request-ID`.
servers:
  - url: /
    description: Mesmo host (via proxy do frontend em http://localhost:8080)
tags:
  - name: health
    description: Saúde do processo e prontidão para atender requisições.
  - name: public
    description: Consulta pública, sem autenticação e somente leitura.
  - name: admin-components
    description: Gestão de componentes. **Sem autenticação nesta versão.**
  - name: admin-incidents
    description: Ciclo de vida de incidentes. **Sem autenticação nesta versão.**
  - name: admin-maintenances
    description: Manutenções programadas. **Sem autenticação nesta versão.**
  - name: admin-templates
    description: Templates de incidentes e manutenções. **Sem autenticação nesta versão.**
  - name: admin-audit
    description: Histórico operacional (auditoria). **Sem autenticação nesta versão.**

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness
      description: Indica que o processo está vivo e atende HTTP. Não verifica o banco de dados.
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness
      description: Indica que o processo está pronto para atender, incluindo conexão com o PostgreSQL (timeout de 2 s).
      responses:
        '200':
          description: Pronto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ready }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/openapi.yaml:
    get:
      tags: [health]
      operationId: getOpenAPISpec
      summary: Especificação OpenAPI
      description: Este documento. A Swagger UI está em `/swagger/`.
      responses:
        '200':
          description: Documento OpenAPI 3.0 em YAML.
          content:
            application/yaml:
              schema: { type: object }

  /api/v1/status:
    get:
      tags: [public]
      operationId: getStatusSummary
      summary: Resumo público de status
      description: |
        Status geral, componentes públicos com status efetivo, incidentes ativos com linha do tempo e
        manutenções em andamento e futuras. Os dados são lidos em um snapshot consistente.
      responses:
        '200':
          description: Resumo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusSummary' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/components:
    get:
      tags: [public]
      operationId: listPublicComponents
      summary: Componentes públicos
      description: Componentes públicos e ativos com status efetivo, na ordem de exibição.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicComponentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/incidents:
    get:
      tags: [public]
      operationId: listPublicIncidents
      summary: Incidentes (ativos e históricos)
      parameters:
        - $ref: '#/components/parameters/IncidentState'
        - $ref: '#/components/parameters/IncidentImpactFilter'
        - $ref: '#/components/parameters/IncidentSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada com a atualização mais recente de cada incidente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicIncidentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/incidents/{id}:
    get:
      tags: [public]
      operationId: getPublicIncident
      summary: Incidente com linha do tempo
      description: Inclui até 100 atualizações, da mais recente para a mais antiga.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Incidente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicIncident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/maintenances:
    get:
      tags: [public]
      operationId: listPublicMaintenances
      summary: Manutenções programadas
      parameters:
        - $ref: '#/components/parameters/MaintenanceState'
        - $ref: '#/components/parameters/MaintenanceSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMaintenanceList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/maintenances/{id}:
    get:
      tags: [public]
      operationId: getPublicMaintenance
      summary: Manutenção com histórico de atualizações
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Manutenção.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMaintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/components:
    get:
      tags: [admin-components]
      operationId: listComponents
      summary: Listar componentes
      parameters:
        - { name: is_active, in: query, schema: { type: boolean }, description: Filtra por ativo/desativado. }
        - { name: is_public, in: query, schema: { type: boolean }, description: Filtra por visibilidade pública. }
        - name: sort
          in: query
          description: 'Ordenação. Padrão: `display_order`.'
          schema: { type: string, enum: [display_order, -display_order, name, -name, created_at, -created_at, updated_at, -updated_at] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComponentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-components]
      operationId: createComponent
      summary: Criar componente
      description: Quando `slug` é omitido, é derivado do nome (sem acentos).
      requestBody:
        $ref: '#/components/requestBodies/ComponentCreate'
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/components/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-components]
      operationId: getComponent
      summary: Consultar componente
      responses:
        '200':
          description: Componente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-components]
      operationId: updateComponent
      summary: Atualizar, desativar ou reativar componente
      description: |
        Atualização parcial. Componentes não são excluídos: `is_active: false` os remove da página pública
        e de novas associações, preservando o histórico.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComponentPatch' }
            example: { status: degraded_performance }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Component' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/incidents:
    get:
      tags: [admin-incidents]
      operationId: listIncidents
      summary: Listar incidentes
      parameters:
        - $ref: '#/components/parameters/IncidentState'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/IncidentStatus' } }
        - $ref: '#/components/parameters/IncidentImpactFilter'
        - { name: component_id, in: query, schema: { type: string, format: uuid }, description: Incidentes associados ao componente. }
        - $ref: '#/components/parameters/IncidentSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-incidents]
      operationId: createIncident
      summary: Abrir incidente
      description: |
        Cria o incidente e publica a primeira atualização na mesma transação. O status inicial deve ser
        aberto (`investigating`, `identified` ou `monitoring`). Componentes desativados não podem ser associados.
        `template_id` apenas registra o template usado para preencher o formulário; o texto é copiado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentCreate' }
            example:
              title: Lentidão na API pública
              message: Estamos investigando relatos de lentidão.
              impact: minor
              component_ids: [3f1c2b4a-8d2e-4c1a-9b7e-1a2b3c4d5e6f]
      responses:
        '201':
          description: Criado, com a linha do tempo.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incidents/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-incidents]
      operationId: getIncident
      summary: Consultar incidente
      responses:
        '200':
          description: Incidente com linha do tempo (até 100 atualizações).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-incidents]
      operationId: updateIncident
      summary: Editar metadados do incidente
      description: |
        Edita título, impacto, notas internas e início, sem publicar atualização. Status, mensagens e
        componentes afetados mudam apenas por atualizações publicadas (`POST .../updates`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentPatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incidents/{id}/updates:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-incidents]
      operationId: listIncidentUpdates
      summary: Linha do tempo paginada
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Atualizações, da mais recente para a mais antiga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentUpdateList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-incidents]
      operationId: publishIncidentUpdate
      summary: Publicar atualização (e transição de status)
      description: |
        Publica uma entrada imutável na linha do tempo. Transições válidas: de qualquer status aberto
        (`investigating`, `identified`, `monitoring`) para qualquer status, inclusive o mesmo (atualização
        só de mensagem) e `resolved`. Incidentes resolvidos não aceitam atualizações (409 `incident_resolved`).
        `component_ids`, quando enviado, substitui os componentes afetados e fica registrado na atualização.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentUpdateCreate' }
            example: { status: identified, message: Identificamos a causa e estamos aplicando a correção. }
      responses:
        '201':
          description: Publicada. Retorna o incidente atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incidents/{id}/resolve:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-incidents]
      operationId: resolveIncident
      summary: Encerrar incidente
      description: |
        Publica a mensagem de encerramento, define `resolved_at` e retira o incidente da lista de ativos,
        mantendo-o no histórico. Encerrar um incidente já resolvido retorna 409 `incident_already_resolved`
        (não é ignorado silenciosamente, para que nenhuma mensagem seja descartada sem aviso).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentResolve' }
            example: { message: O problema foi resolvido. }
      responses:
        '200':
          description: Resolvido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/maintenances:
    get:
      tags: [admin-maintenances]
      operationId: listMaintenances
      summary: Listar manutenções
      parameters:
        - $ref: '#/components/parameters/MaintenanceState'
        - { name: component_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/MaintenanceSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-maintenances]
      operationId: createMaintenance
      summary: Programar manutenção
      description: |
        `scheduled_start` e `scheduled_end` aceitam RFC 3339 com offset ou data e hora locais
        (`AAAA-MM-DDTHH:MM[:SS]`) interpretadas no `timezone` IANA informado. O servidor armazena os
        instantes em UTC; o timezone da máquina ou do navegador nunca é usado. O término deve ser posterior
        ao início, estar no futuro, e a janela deve ter no máximo 31 dias.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceCreate' }
            example:
              title: Atualização do banco de dados
              message: Faremos uma atualização programada.
              expected_impact: degraded_performance
              timezone: America/Sao_Paulo
              scheduled_start: '2026-11-20T02:00'
              scheduled_end: '2026-11-20T04:00'
      responses:
        '201':
          description: Programada.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-maintenances]
      operationId: getMaintenance
      summary: Consultar manutenção
      responses:
        '200':
          description: Manutenção com histórico (até 100 atualizações).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-maintenances]
      operationId: updateMaintenance
      summary: Editar ou reprogramar manutenção
      description: |
        Permitido apenas para `scheduled` e `in_progress` (409 `maintenance_closed` caso contrário). O início
        previsto não pode mudar depois que a manutenção começou (409 `maintenance_already_started`). Alterar
        apenas `timezone` não muda os instantes, somente a apresentação. Reprogramações ficam no histórico
        operacional; para explicá-las publicamente, publique uma mensagem.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenancePatch' }
      responses:
        '200':
          description: Atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}/updates:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-maintenances]
      operationId: listMaintenanceUpdates
      summary: Histórico paginado
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Atualizações, da mais recente para a mais antiga.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceUpdateList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-maintenances]
      operationId: publishMaintenanceMessage
      summary: Publicar mensagem
      description: Publica uma mensagem sem mudar o status. Apenas para manutenções `scheduled` ou `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceMessageCreate' }
      responses:
        '201':
          description: Publicada. Retorna a manutenção atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}/start:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-maintenances]
      operationId: startMaintenance
      summary: Iniciar manutenção
      description: '`scheduled` → `in_progress`. `started_at` recebe o horário do servidor; início antecipado é permitido.'
      requestBody: { $ref: '#/components/requestBodies/MaintenanceTransition' }
      responses: &transitionResponses
        '200':
          description: Transição aplicada. Retorna a manutenção atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenances/{id}/complete:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-maintenances]
      operationId: completeMaintenance
      summary: Concluir manutenção
      description: '`in_progress` → `completed`. Nunca ocorre automaticamente ao fim da janela prevista.'
      requestBody: { $ref: '#/components/requestBodies/MaintenanceTransition' }
      responses: *transitionResponses
  /api/v1/admin/maintenances/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    post:
      tags: [admin-maintenances]
      operationId: cancelMaintenance
      summary: Cancelar manutenção
      description: '`scheduled` → `cancelled`. Uma manutenção em andamento deve ser concluída, não cancelada.'
      requestBody: { $ref: '#/components/requestBodies/MaintenanceTransition' }
      responses: *transitionResponses

  /api/v1/admin/incident-templates:
    get:
      tags: [admin-templates]
      operationId: listIncidentTemplates
      summary: Listar templates de incidente
      parameters:
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/TemplateSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTemplateList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-templates]
      operationId: createIncidentTemplate
      summary: Criar template de incidente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentTemplateCreate' }
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTemplate' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/incident-templates/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-templates]
      operationId: getIncidentTemplate
      summary: Consultar template de incidente
      responses:
        '200':
          description: Template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-templates]
      operationId: updateIncidentTemplate
      summary: Editar, ativar ou desativar template de incidente
      description: Alterar um template não modifica incidentes já criados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentTemplatePatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenance-templates:
    get:
      tags: [admin-templates]
      operationId: listMaintenanceTemplates
      summary: Listar templates de manutenção
      parameters:
        - { name: is_active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/TemplateSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTemplateList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin-templates]
      operationId: createMaintenanceTemplate
      summary: Criar template de manutenção
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceTemplateCreate' }
      responses:
        '201':
          description: Criado.
          headers: { Location: { $ref: '#/components/headers/Location' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTemplate' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/admin/maintenance-templates/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [admin-templates]
      operationId: getMaintenanceTemplate
      summary: Consultar template de manutenção
      responses:
        '200':
          description: Template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [admin-templates]
      operationId: updateMaintenanceTemplate
      summary: Editar, ativar ou desativar template de manutenção
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceTemplatePatch' }
      responses:
        '200':
          description: Atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceTemplate' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/admin/audit-events:
    get:
      tags: [admin-audit]
      operationId: listAuditEvents
      summary: Histórico operacional
      description: |
        Eventos registrados na mesma transação de cada alteração. `source` identifica o canal (`admin_api`);
        não há identidade de usuário nesta versão.
      parameters:
        - name: resource_type
          in: query
          schema: { type: string, enum: [component, incident, maintenance, incident_template, maintenance_template] }
        - { name: resource_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 64 }, description: 'Ex.: created, updated, resolved, started.' }
        - name: sort
          in: query
          description: 'Padrão: `-occurred_at`.'
          schema: { type: string, enum: [occurred_at, -occurred_at] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventList' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identificador do recurso. Valores que não são UUID resultam em 404.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    IncidentState:
      name: state
      in: query
      description: '`active` (não resolvidos) ou `resolved`.'
      schema: { type: string, enum: [active, resolved] }
    IncidentImpactFilter:
      name: impact
      in: query
      schema: { $ref: '#/components/schemas/IncidentImpact' }
    IncidentSort:
      name: sort
      in: query
      description: 'Padrão: `-started_at`.'
      schema: { type: string, enum: [started_at, -started_at, created_at, -created_at, updated_at, -updated_at] }
    MaintenanceState:
      name: state
      in: query
      description: |
        `upcoming` (scheduled), `in_progress`, `completed`, `cancelled`, `open` (scheduled + in_progress) ou
        `past` (completed + cancelled). Padrão de ordenação: `scheduled_start` para upcoming/in_progress/open e
        `-scheduled_start` para os demais.
      schema: { type: string, enum: [upcoming, in_progress, completed, cancelled, open, past] }
    MaintenanceSort:
      name: sort
      in: query
      schema: { type: string, enum: [scheduled_start, -scheduled_start, created_at, -created_at, updated_at, -updated_at] }
    TemplateSort:
      name: sort
      in: query
      description: 'Padrão: `name`.'
      schema: { type: string, enum: [name, -name, created_at, -created_at, updated_at, -updated_at] }

  headers:
    Location:
      description: URL do recurso criado.
      schema: { type: string }

  requestBodies:
    ComponentCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ComponentCreate' }
          example: { name: API pública, description: Endpoints REST para integrações. }
    MaintenanceTransition:
      required: false
      description: Corpo opcional com mensagem pública da transição.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MaintenanceTransition' }
          example: { message: A manutenção foi iniciada. }

  responses:
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: incident_not_found, message: Recurso não encontrado., request_id: 4f2a9c1b7d3e5a6b8c9d0e1f } }
    Conflict:
      description: |
        Conflito com o estado atual. Códigos: `component_slug_conflict`, `template_name_conflict`,
        `incident_resolved`, `incident_already_resolved`, `maintenance_closed`, `maintenance_already_started`,
        `maintenance_invalid_transition`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: maintenance_invalid_transition, message: "A ação 'complete' não é permitida para uma manutenção com status 'scheduled'.", request_id: 4f2a9c1b7d3e5a6b8c9d0e1f } }
    ValidationError:
      description: Dados inválidos (`validation_failed`, `invalid_json`, `empty_update`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: validation_failed, message: Os dados enviados são inválidos., details: [ { field: title, message: Informe um título com 1 a 200 caracteres. } ], request_id: 4f2a9c1b7d3e5a6b8c9d0e1f } }
    PayloadTooLarge:
      description: Corpo maior que 64 KiB (`payload_too_large`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Corpo enviado com Content-Type diferente de application/json (`unsupported_media_type`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Dependência indisponível ou tempo limite excedido (`database_unavailable`, `request_timeout`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Erro inesperado (`internal_error`). Detalhes ficam apenas nos logs, correlacionados por `request_id`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, description: Código estável para tratamento programático. }
            message: { type: string, description: Mensagem legível (pt-BR). }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
            request_id: { type: string }

    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }

    ComponentStatus:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage, maintenance]
      description: Status declarado (ou efetivo, nas rotas públicas) de um componente.
    OverallStatus:
      type: string
      enum: [operational, degraded_performance, partial_outage, major_outage, maintenance, unknown]
    IncidentStatus:
      type: string
      enum: [investigating, identified, monitoring, resolved]
      description: '`resolved` é terminal.'
    OpenIncidentStatus:
      type: string
      enum: [investigating, identified, monitoring]
    IncidentImpact:
      type: string
      enum: [minor, major, critical]
      description: 'Impacto: minor → degraded_performance, major → partial_outage, critical → major_outage.'
    MaintenanceStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]
      description: 'Transições: scheduled → in_progress → completed; scheduled → cancelled.'
    ExpectedImpact:
      type: string
      enum: [none, degraded_performance, partial_outage, major_outage]
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 em UTC.
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
    InputInstant:
      type: string
      description: RFC 3339 com offset (ex. `2026-11-20T02:00:00-03:00`) ou data e hora locais (`2026-11-20T02:00`) interpretadas no `timezone`.
      example: '2026-11-20T02:00'
    UUIDList:
      type: array
      maxItems: 50
      items: { type: string, format: uuid }

    ComponentRef:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    Component:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, status, is_public, is_active, display_order, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        is_public: { type: boolean }
        is_active: { type: boolean }
        display_order: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ComponentCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: Único. Derivado do nome quando omitido. }
        description: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        is_public: { type: boolean, default: true }
        display_order: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    ComponentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        slug: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        is_public: { type: boolean }
        is_active: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
    ComponentList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Component' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PublicComponent:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ComponentStatus' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PublicComponentList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PublicComponent' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    IncidentUpdate:
      type: object
      additionalProperties: false
      required: [id, status, message, components, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        message: { type: string }
        components:
          type: array
          nullable: true
          description: Componentes afetados definidos por esta atualização; `null` quando não foram alterados.
          items: { $ref: '#/components/schemas/ComponentRef' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Incident:
      type: object
      additionalProperties: false
      required: [id, title, impact, status, internal_notes, started_at, resolved_at, template_id, components, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        internal_notes: { type: string, description: Notas operacionais; nunca expostas publicamente. }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { $ref: '#/components/schemas/NullableTimestamp' }
        template_id: { type: string, format: uuid, nullable: true }
        components: { type: array, items: { $ref: '#/components/schemas/ComponentRef' } }
        latest_update: { $ref: '#/components/schemas/IncidentUpdate' }
        updates:
          type: array
          description: Presente nas consultas individuais.
          items: { $ref: '#/components/schemas/IncidentUpdate' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PublicIncident:
      type: object
      additionalProperties: false
      required: [id, title, impact, status, started_at, resolved_at, components, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        resolved_at: { $ref: '#/components/schemas/NullableTimestamp' }
        components:
          type: array
          description: Apenas componentes públicos.
          items: { $ref: '#/components/schemas/ComponentRef' }
        latest_update: { $ref: '#/components/schemas/IncidentUpdate' }
        updates: { type: array, items: { $ref: '#/components/schemas/IncidentUpdate' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    IncidentCreate:
      type: object
      additionalProperties: false
      required: [title, message, impact]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 5000, description: Primeira mensagem pública. }
        status: { $ref: '#/components/schemas/OpenIncidentStatus' }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        component_ids: { $ref: '#/components/schemas/UUIDList' }
        started_at: { type: string, format: date-time, description: 'Início conhecido (RFC 3339 com offset, não futuro). Padrão: agora.' }
        internal_notes: { type: string, maxLength: 5000 }
        template_id: { type: string, format: uuid }
    IncidentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        impact: { $ref: '#/components/schemas/IncidentImpact' }
        internal_notes: { type: string, maxLength: 5000 }
        started_at: { type: string, format: date-time }
    IncidentUpdateCreate:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status: { $ref: '#/components/schemas/IncidentStatus' }
        message: { type: string, minLength: 1, maxLength: 5000 }
        component_ids: { $ref: '#/components/schemas/UUIDList' }
    IncidentResolve:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
    IncidentList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PublicIncidentList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PublicIncident' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    IncidentUpdateList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/IncidentUpdate' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    MaintenanceUpdate:
      type: object
      additionalProperties: false
      required: [id, kind, status, message, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [created, message, started, completed, cancelled] }
        status: { $ref: '#/components/schemas/MaintenanceStatus' }
        message: { type: string, nullable: true, description: '`null` em transições publicadas sem mensagem.' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Maintenance:
      type: object
      additionalProperties: false
      required: [id, title, description, expected_impact, status, timezone, scheduled_start, scheduled_end, started_at, completed_at, cancelled_at, start_overdue, end_overdue, internal_notes, template_id, components, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        expected_impact: { $ref: '#/components/schemas/ExpectedImpact' }
        status: { $ref: '#/components/schemas/MaintenanceStatus' }
        timezone: { type: string }
        scheduled_start: { $ref: '#/components/schemas/Timestamp' }
        scheduled_end: { $ref: '#/components/schemas/Timestamp' }
        started_at: { $ref: '#/components/schemas/NullableTimestamp' }
        completed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        cancelled_at: { $ref: '#/components/schemas/NullableTimestamp' }
        start_overdue: { type: boolean }
        end_overdue: { type: boolean }
        internal_notes: { type: string }
        template_id: { type: string, format: uuid, nullable: true }
        components: { type: array, items: { $ref: '#/components/schemas/ComponentRef' } }
        latest_update: { $ref: '#/components/schemas/MaintenanceUpdate' }
        updates: { type: array, items: { $ref: '#/components/schemas/MaintenanceUpdate' } }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    PublicMaintenance:
      type: object
      additionalProperties: false
      required: [id, title, description, expected_impact, status, timezone, scheduled_start, scheduled_end, started_at, completed_at, cancelled_at, start_overdue, end_overdue, components, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        expected_impact: { $ref: '#/components/schemas/ExpectedImpact' }
