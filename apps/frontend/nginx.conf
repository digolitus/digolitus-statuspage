# Served by nginx-unprivileged (non-root, port 8080). This file is included
# in the http context, so rate-limit zones can be declared here.

# Per-client request rates (abuse mitigation, not access control). Admin
# routes are stricter; login and setup attempts are slowest, on top of the
# backend's per-account lockout.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=subscribe:10m rate=6r/m;
limit_req_status 429;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API rejects bodies above 64 KiB; refuse them early here too.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    # $http_host keeps the port, so the backend can compare Origin with Host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Correlates Nginx and backend logs; the backend echoes it back.
    proxy_set_header X-Request-ID $request_id;

    # Security headers for the SPA. Note: add_header in a location replaces
    # these, so locations that need headers repeat the relevant ones.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    location = /api/v1/auth/setup {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8080;
    }

    # Public subscription endpoints send e-mail: keep them slow per client.
    location /api/v1/subscriptions {
        limit_req zone=subscribe burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/v1/admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8080;
    }

    # Swagger UI sets its own (stricter for scripts) CSP; only non-CSP
    # headers are added here to avoid two conflicting policies.
    location /swagger {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8080;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://backend:8080/readyz;
    }

    # Vite emits content-hashed file names under /assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
