# git-cliff configuration: release notes and next version from Conventional
# Commits. Used by scripts/release.sh (see docs/operations.md, "Releases").
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Gerado a partir dos commits (Conventional Commits) por `scripts/release.sh`.\n
"""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Não lançado
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**incompatível**] {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/digolitus/digolitus-statuspage" },
]

[git]
conventional_commits = true
# Commits outside the convention (e.g. "Update README.md") are left out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Novidades" },
  { message = "^fix", group = "<!-- 1 -->Correções" },
  { message = "^perf", group = "<!-- 2 -->Desempenho" },
  { message = "^sec", group = "<!-- 3 -->Segurança" },
  { message = "^build|^deps", group = "<!-- 4 -->Build e dependências" },
  { message = "^refactor", group = "<!-- 5 -->Refatoração" },
  { message = "^docs", group = "<!-- 6 -->Documentação" },
  { message = "^test", group = "<!-- 7 -->Testes" },
  { message = "^ci", group = "<!-- 8 -->CI" },
  { message = "^style|^chore|^revert", group = "<!-- 9 -->Outros" },
]

[bump]
# Same rules as semantic-release: feat -> minor, fix and others -> patch,
# breaking change -> major (also while on 0.x).
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
