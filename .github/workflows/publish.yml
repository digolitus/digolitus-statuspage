# Publishes container images to GHCR, only for commits that already passed
# CI on a push to main or on a v* tag (never for pull requests). Images are
# rebuilt from the approved commit, scanned with Trivy, and only then pushed.
#
# Tags: sha-<full commit SHA> (immutable, use it to deploy), "main" for the
# main branch, and <major>.<minor>.<patch> / <major>.<minor> for releases.
# "latest" is deliberately not published.
name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.76.0

jobs:
  publish:
    name: Publish ${{ matrix.app }}
    # CI runs on push only for main and v* tags, so a successful push run is
    # either the main branch or a release tag.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/digolitus-statuspage-${{ matrix.app }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_REF: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/${{ matrix.app }}:${{ env.HEAD_SHA }}
          cache-from: type=gha,scope=publish-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.app }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: scan/${{ matrix.app }}:${{ env.HEAD_SHA }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ env.HEAD_SHA }}
            type=raw,value=main,enable=${{ env.HEAD_REF == 'main' }}
            type=semver,pattern={{version}},value=${{ env.HEAD_REF }},enable=${{ env.HEAD_REF != 'main' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.HEAD_REF }},enable=${{ env.HEAD_REF != 'main' }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.app }}

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "Commit: \`${HEAD_SHA}\`"
            echo "Digest: \`${DIGEST}\`"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
