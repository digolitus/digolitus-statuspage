# TEMPORARY: regenerates apps/frontend/package-lock.json after a dependency
# upgrade made where the npm registry is unreachable, commits it to the same
# branch and then runs lint, tests and build. Remove after use.
name: Frontend lockfile (temporary)

on:
  push:
    branches: [feat/status-incidents-maintenance]
    paths: [apps/frontend/package.json]

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Regenerate lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then echo "lockfile unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): regenera package-lock.json após atualização de dependências"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Type-check and build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
